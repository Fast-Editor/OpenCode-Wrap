[package]
name = "opencode-wrap"
version = "0.3.0"
edition = "2021"
description = "OpenAI-compatible API in front of `opencode serve`"
license = "MIT"

[[bin]]
name = "opencode-wrap"
path = "src/main.rs"

[lib]
name = "opencode_wrap"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
regex = "1"
rand = "0.9"
tokio-stream = "0.1"
http-body-util = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
